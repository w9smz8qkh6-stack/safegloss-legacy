services:
  - type: web
    name: safegloss-legacy
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn rgx_project.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safegloss-legacy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: safegloss-legacy-db
    plan: free
    databaseName: safegloss_legacy
    user: safegloss_user
