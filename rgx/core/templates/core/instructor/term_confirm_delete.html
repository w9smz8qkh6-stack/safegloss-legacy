{% extends "core/base.html" %}

{% block title %}Delete Term{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white">
        <i class="bi bi-exclamation-triangle me-2"></i>Confirm Delete
      </div>
      <div class="card-body">
        <p>Are you sure you want to delete the term <strong>"{{ term.term_text }}"</strong>?</p>
        <p class="text-muted mb-0">
          Story: {{ story.title }}
        </p>
      </div>
      <div class="card-footer d-flex gap-2">
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash me-2"></i>Delete Term
          </button>
        </form>
        <a href="{% url 'core:story_edit' story.pk %}?tab=glossary" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
