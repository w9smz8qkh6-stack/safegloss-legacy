{% extends "core/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-8">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0">
        <i class="bi bi-question-circle me-2"></i>{{ title }}
      </h1>
      <a href="{% url 'core:quiz_list' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-2"></i>Back to Quizzes
      </a>
    </div>

    <div class="card">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label for="id_title" class="form-label">Title <span class="text-danger">*</span></label>
            {{ form.title }}
          </div>

          <div class="mb-3">
            <label for="id_instructions_html" class="form-label">Instructions</label>
            {{ form.instructions_html }}
            <div class="form-text">Instructions shown to students before they start the quiz.</div>
          </div>

          <div class="mb-3">
            <label for="id_total_points" class="form-label">Total Points</label>
            {{ form.total_points }}
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle me-2"></i>Save Quiz
            </button>
            <a href="{% url 'core:quiz_list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
