{% extends "account/base.html" %}
{% load django_bootstrap5 %}

{% block title %}Sign In - Safegloss{% endblock %}

{% block content %}
<div class="card auth-card">
  <div class="auth-header text-white">
    <i class="bi bi-book"></i>
    <h3 class="mt-2 mb-0">Safegloss</h3>
    <p class="mb-0 opacity-75">Sign in to continue</p>
  </div>
  <div class="card-body p-4">
    <form method="post" action="{% url 'account_login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_login" class="form-label">
          <i class="bi bi-person me-1"></i>Username or Email
        </label>
        <input type="text" name="login" id="id_login" class="form-control form-control-lg"
               placeholder="Enter your username or email" required autofocus>
      </div>
      <div class="mb-3">
        <label for="id_password" class="form-label">
          <i class="bi bi-lock me-1"></i>Password
        </label>
        <input type="password" name="password" id="id_password" class="form-control form-control-lg"
               placeholder="Enter your password" required>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" name="remember" id="id_remember" class="form-check-input">
        <label for="id_remember" class="form-check-label">Remember me</label>
      </div>
      {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
      {% endif %}
      <button type="submit" class="btn btn-primary btn-lg w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>
  </div>
  <div class="card-footer bg-light text-center py-3">
    <a href="{% url 'account_reset_password' %}" class="text-muted text-decoration-none">
      Forgot your password?
    </a>
    <hr class="my-3">
    <span class="text-muted">Don't have an account?</span>
    <a href="{% url 'account_signup' %}" class="ms-1">Sign up</a>
  </div>
</div>
{% endblock %}
