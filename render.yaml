services:
  - type: web
    name: rgx-reading-experiments
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn rgx_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rgx-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"

databases:
  - name: rgx-postgres
    plan: free
