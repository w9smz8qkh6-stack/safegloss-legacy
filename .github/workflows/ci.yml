name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Documentation completion check
        env:
          SAFEGLOSS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_documentation_updates.py

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build application image
        run: docker build --tag safegloss-legacy:ci .

      - name: Lint PHP
        run: >-
          docker run --rm --entrypoint sh safegloss-legacy:ci -c
          'find /var/www/html /var/www/safegloss -name "*.php" -print0 |
          xargs -0 -n1 php -l'

      - name: Run domain tests
        run: docker run --rm safegloss-legacy:ci php /var/www/safegloss/tests/domain_test.php

      - name: Initialize MySQL and smoke test HTTP
        run: |
          docker compose up -d --build --wait
          curl --fail --silent --show-error --head http://127.0.0.1:8088/
          table_count=$(docker compose exec -T db sh -lc 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -N -u "$MYSQL_USER" "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE()"')
          test "$table_count" -ge 18

      - name: Container logs
        if: failure()
        run: docker compose logs

      - name: Stop test stack
        if: always()
        run: docker compose down --volumes
