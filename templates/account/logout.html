{% extends "account/base.html" %}

{% block title %}Sign Out - Reading Experiments{% endblock %}

{% block content %}
<div class="card auth-card">
  <div class="auth-header text-white">
    <i class="bi bi-box-arrow-right"></i>
    <h3 class="mt-2 mb-0">Sign Out</h3>
    <p class="mb-0 opacity-75">Are you sure you want to leave?</p>
  </div>
  <div class="card-body p-4 text-center">
    <p class="text-muted mb-4">You are about to sign out of your account.</p>
    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger btn-lg w-100">
        <i class="bi bi-box-arrow-right me-2"></i>Sign Out
      </button>
    </form>
    <a href="javascript:history.back()" class="btn btn-outline-secondary mt-3">
      <i class="bi bi-arrow-left me-2"></i>Go Back
    </a>
  </div>
</div>
{% endblock %}
