{% extends "account/base.html" %}
{% load django_bootstrap5 %}

{% block title %}Reset Password - Reading Experiments{% endblock %}

{% block content %}
<div class="card auth-card">
  <div class="auth-header text-white">
    <i class="bi bi-key"></i>
    <h3 class="mt-2 mb-0">Reset Password</h3>
    <p class="mb-0 opacity-75">We'll send you a reset link</p>
  </div>
  <div class="card-body p-4">
    <form method="post" action="{% url 'account_reset_password' %}">
      {% csrf_token %}
      <div class="mb-4">
        <label for="id_email" class="form-label">
          <i class="bi bi-envelope me-1"></i>Email Address
        </label>
        <input type="email" name="email" id="id_email" class="form-control form-control-lg"
               placeholder="Enter your email address" required autofocus>
        <div class="form-text">Enter the email address associated with your account.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100">
        <i class="bi bi-send me-2"></i>Send Reset Link
      </button>
    </form>
  </div>
  <div class="card-footer bg-light text-center py-3">
    <a href="{% url 'account_login' %}" class="text-decoration-none">
      <i class="bi bi-arrow-left me-1"></i>Back to Sign In
    </a>
  </div>
</div>
{% endblock %}
