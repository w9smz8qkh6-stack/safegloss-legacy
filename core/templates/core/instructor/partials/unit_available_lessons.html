{% if lessons %}
<div class="list-group list-group-flush" style="max-height: 400px; overflow-y: auto;">
  {% for lesson in lessons %}
  <form method="post" action="{% url 'core:unit_add_lesson' pk=unit.pk %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
    {% csrf_token %}
    <input type="hidden" name="lesson_id" value="{{ lesson.pk }}">
    <div>
      <i class="bi bi-journal-text me-2 text-primary"></i>
      <strong>{{ lesson.title }}</strong>
      {% if lesson.story %}
      <br>
      <small class="text-muted">
        <i class="bi bi-book me-1"></i>{{ lesson.story.title|truncatechars:50 }}
      </small>
      {% endif %}
    </div>
    <button type="submit" class="btn btn-outline-success btn-sm">
      <i class="bi bi-plus-circle me-1"></i>Add
    </button>
  </form>
  {% endfor %}
</div>
{% else %}
<div class="text-center py-4 text-muted">
  <i class="bi bi-check-circle fs-2 d-block mb-2"></i>
  <p class="mb-0">All your lessons are already in this unit.</p>
</div>
{% endif %}
