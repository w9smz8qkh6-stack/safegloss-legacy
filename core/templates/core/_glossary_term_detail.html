<div class="glossary-term-popover">
  <div class="fw-bold mb-1">{{ term.term_text }}</div>
  {% if term.ipa %}
    <div class="text-muted mb-1">/{{ term.ipa }}/</div>
  {% endif %}
  <div class="mb-2">{{ term.definition_html|safe }}</div>
  {% if term.translation %}
    <div class="badge bg-light text-dark">
      {{ term.translation }} ({{ term.translation_lang_code }})
    </div>
  {% endif %}
</div>
